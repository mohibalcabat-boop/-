<!DOCTYPE html> <html lang="ar" 
dir="rtl"> <head>
    <meta charset="UTF-8"> <meta 
    name="viewport" 
    content="width=device-width, 
    initial-scale=1.0"> 
    <title>sar_linx | نموذج 
    السيرة الذاتية 
    التفاعلية</title> <style>
        :root {
            --bg-color: #1c1411; 
            --card-bg: #2d201b; 
            --text-color: 
            #f5efe6;
            --desc-color: 
            #ffffff;
            --accent-color: 
            #d4a373;
            --border-color: 
            #4a352a;
        }
        body { font-family: 
        Tahoma, sans-serif; 
        background-color: 
        var(--bg-color); color: 
        var(--text-color); 
        margin: 0; padding: 15px; 
        }
        .container { max-width: 
        600px; margin: 0 auto; } 
        .header { background: 
        var(--card-bg); padding: 
        25px 20px; border-radius: 
        14px; text-align: center; 
        margin-bottom: 20px; 
        border: 1px solid 
        var(--border-color); 
        box-shadow: 0 4px 10px 
        rgba(0,0,0,0.4); }
        
        /* حقول الإدخال الحرة 
        للزائر */ .input-name { 
        width: 90%; background: 
        var(--bg-color); border: 
        1px solid 
        var(--accent-color); 
        color: 
        var(--accent-color); 
        padding: 8px; 
        border-radius: 8px; 
        font-size: 18px; 
        font-weight: bold; 
        text-align: center; 
        margin-bottom: 8px; } 
        .input-title { width: 
        90%; background: 
        var(--bg-color); border: 
        1px solid 
        var(--border-color); 
        color: var(--desc-color); 
        padding: 6px; 
        border-radius: 6px; 
        font-size: 13px; 
        text-align: center; } 
        .section-card { 
        background: 
        var(--card-bg); 
        border-radius: 12px; 
        padding: 15px; 
        margin-bottom: 15px; 
        border: 1px solid 
        var(--border-color); } 
        .section-title { 
        font-size: 15px; 
        font-weight: bold; color: 
        var(--accent-color); 
        margin-bottom: 8px; 
        border-bottom: 1px solid 
        var(--border-color); 
        padding-bottom: 5px; } 
        .input-content { width: 
        95%; background: 
        var(--bg-color); border: 
        1px solid 
        var(--border-color); 
        color: var(--desc-color); 
        padding: 8px; 
        border-radius: 6px; 
        font-size: 13px; 
        line-height: 1.5; resize: 
        vertical; }
        
        .action-section { 
        text-align: center; 
        margin-top: 25px; } 
        .action-btn { background: 
        var(--accent-color); 
        color: #1c1411; border: 
        none; padding: 12px 25px; 
        border-radius: 8px; 
        font-size: 14px; 
        font-weight: bold; 
        cursor: pointer; 
        box-shadow: 0 4px 8px 
        rgba(0,0,0,0.3); } 
        .action-btn:hover { 
        opacity: 0.9; } .toast { 
        margin-top: 10px; 
        font-size: 12px; color: 
        var(--accent-color); 
        display: none; } 
        .back-link { display: 
        block; text-align: 
        center; margin-top: 20px; 
        color: 
        var(--accent-color); 
        text-decoration: none; 
        font-size: 13px; }
    </style> </head> <body> <div 
    class="container">
        <div class="header"> <!-- 
            الزائر يكتب اسمه --> 
            <input type="text" 
            class="input-name" 
            value="اسم صاحب 
            السيرة الذاتية"> <!-- 
            الزائر يكتب المسمى 
            الوظيفي أو التخصص --> 
            <input type="text" 
            class="input-title" 
            value="المسمى الوظيفي 
            أو التخصص التقني">
        </div> <div 
        class="section-card">
            <div 
            class="section-title">👤 
            نبذة تعريفية</div> 
            <textarea 
            class="input-content" 
            rows="3">اكتب هنا 
            نبذة مختصرة عن خلفيتك 
            المهنية، شغفك، وأبرز 
            اهتماماتك 
            التقنية...</textarea>
        </div> <div 
        class="section-card">
            <div 
            class="section-title">💻 
            المهارات 
            والقدرات</div> 
            <textarea 
            class="input-content" 
            rows="3">اكتب هنا 
            مهاراتك (مثل: تطوير 
            الويب، إدارة قواعد 
            البيانات، لغات 
            البرمجة)...</textarea>
        </div> <div 
        class="section-card">
            <div 
            class="section-title">🎓 
            التعليم 
            والخبرات</div> 
            <textarea 
            class="input-content" 
            rows="3">اكتب هنا 
            خبراتك العملية 
            السابقة أو مؤهلاتك 
            التعليمية...</textarea>
        </div> <div 
        class="action-section">
            <button 
            class="action-btn" 
            onclick="shareCV()">📤 
            مشاركة هذه السيرة 
            الذاتية</button> <div 
            id="toast" 
            class="toast">تم 
            تجهيز بيانات السيرة 
            الذاتية للمشاركة! 
            📋</div>
        </div> <a 
        href="index.html" 
        class="back-link">← 
        العودة إلى لوحة التحكم 
        الرئيسية</a>
    </div> <script> function 
        shareCV() {
            const textToShare = 
            "نموذج السيرة الذاتية 
            الرقمية - منصة 
            sar_linx"; if 
            (navigator.share) {
                navigator.share({title: 
                'السيرة الذاتية', 
                text: 
                textToShare, url: 
                window.location.href}).catch(()=>{});
            } else {
                navigator.clipboard.writeText(textToShare).then(() 
                => {
                    const t = 
                    document.getElementById('toast'); 
                    t.style.display 
                    = 'block'; 
                    setTimeout(() 
                    => 
                    t.style.display 
                    = 'none', 
                    3000);
                });
            }
        }
    </script> </body> </html>
