<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الشخصية</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: Tahoma, sans-serif;
            text-align: center;
            padding: 40px 20px;
            margin: 0;
        }
        h1 {
            color: #38bdf8;
            margin-bottom: 10px;
        }
        p {
            color: #94a3b8;
            margin-bottom: 30px;
        }
        .menu-container {
            max-width: 400px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .btn {
            background-color: #1e293b;
            color: white;
            padding: 15px 20px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            border: 1px solid #334155;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: 0.3s;
            display: block;
        }
        .btn:hover {
            background-color: #334155;
            border-color: #38bdf8;
        }
        .btn-media {
            border-color: #ec4899;
        }
        .btn-media:hover {
            background-color: #db2777;
        }
    </style>
</head>
<body>

    <h1>🚀 لوحة التحكم الشخصية</h1>
    <p>اختر الموقع الذي تريد الانتقال إليه:</p>

    <div class="menu-container">
        <!-- زر موقع المانجا -->
        <a href="manga.html" class="btn">📖 موقع المانجا</a>

        <!-- زر موقع الصور والفيديوهات -->
        <a href="media_index.html" class="btn btn-media">🎬 معرض الصور والفيديوهات</a>
    </div>

</body>
</html>
