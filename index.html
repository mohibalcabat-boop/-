<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sar_linx | منصة المشاريع والخدمات المدرسية</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --desc-color: #94a3b8;
            --accent-color: #38bdf8;
            --border-color: #334155;
            --btn-bg: #0284c7;
            --btn-hover: #0369a1;
        }
        body { 
            font-family: Tahoma, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            margin: 0; 
            padding: 20px; 
        }
        .container { max-width: 600px; margin: 0 auto; }
        .main-header {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            padding: 25px;
            border-radius: 16px;
            text-align: center;
            margin-bottom: 25px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.4);
        }
        .main-header h1 { margin: 0 0 8px 0; font-size: 22px; color: #fff; }
        .main-header p { margin: 0; font-size: 13px; color: #e0f2fe; }

        .menu-list { display: flex; flex-direction: column; gap: 12px; }
        .menu-item {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-decoration: none;
            color: var(--text-color);
            transition: all 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .menu-item:hover {
            border-color: var(--accent-color);
            transform: translateY(-2px);
        }
        .menu-title { font-size: 15px; font-weight: bold; color: var(--accent-color); }
        .menu-desc { font-size: 12px; color: var(--desc-color); margin-top: 4px; }
        .arrow { font-size: 16px; color: var(--accent-color); }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-header">
            <h1>sar_linx Hub</h1>
            <p>منصة إدارة وعرض المشاريع والبحوث المدرسية</p>
        </div>

        <div class="menu-list">
            <!-- المشروع السابع المحدث والموجه للواجهة الجديدة -->
            <a href="welcome2.html" class="menu-item">
                <div>
                    <div class="menu-title">🚀 المشروع السابع: معرض المشاريع والبحوث التفاعلي</div>
                    <div class="menu-desc">صفحة ترحيبية، إرفاق صور وبحوث، تصميم ممتد، وبحث ذكي.</div>
                </div>
                <div class="arrow">←</div>
            </a>
        </div>
    </div>
</body>
</html>
