<!DOCTYPE html> <html lang="ar" 
dir="rtl"> <head>
    <meta charset="UTF-8"> <meta 
    name="viewport" 
    content="width=device-width, 
    initial-scale=1.0"> 
    <title>sar_linx | بطاقة 
    التهنئة الرقمية</title> 
    <style>
        body { font-family: 
            Tahoma, sans-serif; 
            background-color: 
            #0f172a;
            color: #f8fafc; 
            margin: 0; padding: 
            15px;
        }
        .container { max-width: 
        600px; margin: 0 auto; }
        
        .greeting-card { 
            background: 
            linear-gradient(135deg, 
            #1e293b, #0f172a);
            border: 2px solid 
            #38bdf8;
            padding: 30px 20px; 
            border-radius: 16px; 
            text-align: center; 
            margin-bottom: 20px; 
            box-shadow: 0 8px 
            20px rgba(56, 189, 
            248, 0.15); 
            animation: pulseGlow 
            3s infinite 
            alternate;
        }
        @keyframes pulseGlow { 
            from { border-color: 
            #334155; box-shadow: 
            0 4px 10px 
            rgba(0,0,0,0.2); } to 
            { border-color: 
            #38bdf8; box-shadow: 
            0 8px 25px rgba(56, 
            189, 248, 0.25); }
        }
        .greeting-card 
        input.editable-occ {
            width: 90%; 
            background: rgba(2, 
            132, 199, 0.1); 
            border: 1px dashed 
            #38bdf8;
            color: #38bdf8; 
            font-size: 20px; 
            font-weight: bold; 
            text-align: center; 
            padding: 10px; 
            border-radius: 8px; 
            margin-bottom: 15px;
        }
        .greeting-card 
        textarea.editable-msg {
            width: 92%; 
            background: #0f172a; 
            border: 1px solid 
            #334155;
            color: #f8fafc; 
            font-size: 14px; 
            line-height: 1.8; 
            text-align: center; 
            padding: 12px; 
            border-radius: 8px; 
            resize: vertical; 
            margin-bottom: 15px;
        }
        .greeting-card 
        textarea.editable-msg:focus 
        { border-color: #38bdf8; 
        outline: none; } 
        .names-row { display: 
        flex; gap: 10px; 
        justify-content: center; 
        margin-bottom: 10px; } 
        .names-row input {
            flex: 1; background: 
            #0f172a;
            border: 1px solid 
            #334155;
            color: #e2e8f0; 
            font-size: 13px; 
            text-align: center; 
            padding: 8px; 
            border-radius: 6px;
        }
        .card { background: 
            #1e293b;
            border-radius: 12px; 
            padding: 15px; 
            margin-bottom: 15px; 
            border: 1px solid 
            #334155;
            text-align: center;
        }
        .btn { background: 
            #059669;
            color: white; border: 
            none; padding: 12px 
            20px; border-radius: 
            8px; font-size: 14px; 
            font-weight: bold; 
            cursor: pointer; 
            width: 100%; 
            transition: 
            background 0.2s; 
            box-shadow: 0 4px 6px 
            rgba(0,0,0,0.2);
        }
        .btn:hover { background: 
        #047857; }
        .toast { margin-top: 
        10px; font-size: 12px; 
        color: #38bdf8; display: 
        none; } .back-link { 
        display: block; 
        text-align: center; 
        margin-top: 25px; color: 
        #38bdf8; text-decoration: 
        none; font-size: 13px; } 
        .back-link:hover { 
        text-decoration: 
        underline; }
    </style> </head> <body> <div 
    class="container">
        <div 
        class="greeting-card">
            <input type="text" 
            class="editable-occ" 
            value="🎉 تهنئة 
            مباركة ومميزة ✨"> 
            <textarea 
            class="editable-msg" 
            rows="4">كل عام وأنت 
            بخير وسعادة، أتمنى لك 
            أوقاتاً مفعمة بالنجاح 
            والتوفيق، وعسى أن 
            تعود هذه المناسبة 
            عليك بالخير والبركات 
            الدائمة...</textarea>
            
            <div 
            class="names-row">
                <input 
                type="text" 
                value="إلى: 
                الغالي / 
                الغالية"> <input 
                type="text" 
                value="من: المحب 
                / الصديق">
            </div> </div> <div 
        class="card">
            <button class="btn" 
            onclick="shareCard()">📤 
            مشاركة بطاقة 
            التهنئة</button> <div 
            id="toast" 
            class="toast">تم 
            تجهيز رابط البطاقة 
            للمشاركة بنجاح! 
            📋</div>
        </div> <a 
        href="index.html" 
        class="back-link">← 
        العودة إلى قائمة الخدمات 
        الرئيسية</a>
    </div> <script> function 
        shareCard() {
            const textToShare = 
            "بطاقة تهنئة رقمية 
            تفاعلية - منصة 
            sar_linx"; if 
            (navigator.share) {
                navigator.share({title: 
                'بطاقة تهنئة', 
                text: 
                textToShare, url: 
                window.location.href}).catch(()=>{});
            } else {
                navigator.clipboard.writeText(textToShare).then(() 
                => {
                    const t = 
                    document.getElementById('toast'); 
                    t.style.display 
                    = 'block'; 
                    setTimeout(() 
                    => 
                    t.style.display 
                    = 'none', 
                    3000);
                });
            }
        }
    </script> </body> </html>
