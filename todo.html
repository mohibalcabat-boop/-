<!DOCTYPE html> <html lang="ar" 
dir="rtl"> <head>
    <meta charset="UTF-8"> <meta 
    name="viewport" 
    content="width=device-width, 
    initial-scale=1.0"> 
    <title>sar_linx | تطبيق إدارة 
    المهام اليومية</title> 
    <style>
        body { font-family: 
            Tahoma, sans-serif; 
            background-color: 
            #0f172a;
            color: #f8fafc; 
            margin: 0; padding: 
            15px;
        }
        .container { max-width: 
        600px; margin: 0 auto; } 
        .header {
            background: #0284c7; 
            padding: 20px; 
            border-radius: 12px; 
            text-align: center; 
            margin-bottom: 20px; 
            box-shadow: 0 4px 6px 
            rgba(0,0,0,0.3);
        }
        .header h1 { margin: 0 0 
        5px 0; font-size: 22px; 
        color: #fff; } .header p 
        { margin: 5px 0; 
        font-size: 13px; color: 
        #e0f2fe; }
        .card { background: 
            #1e293b;
            border-radius: 12px; 
            padding: 15px; 
            margin-bottom: 15px; 
            border: 1px solid 
            #334155;
            box-shadow: 0 4px 6px 
            rgba(0,0,0,0.2);
        }
        .card-title { font-size: 
        15px; font-weight: bold; 
        color: #38bdf8; 
        margin-bottom: 10px; }
        
        .row { display: flex; 
        gap: 10px; margin-bottom: 
        10px; } input, select {
            flex: 1; background: 
            #0f172a;
            border: 1px solid 
            #334155;
            color: #f8fafc; 
            padding: 10px; 
            border-radius: 8px; 
            font-size: 13px;
        }
        input:focus, select:focus 
        { border-color: #38bdf8; 
        outline: none; } .btn {
            background: #059669; 
            color: white; border: 
            none; padding: 10px 
            20px; border-radius: 
            8px; font-size: 14px; 
            font-weight: bold; 
            cursor: pointer; 
            width: 100%; 
            transition: 
            background 0.2s;
        }
        .btn:hover { background: 
        #047857; }
        
        .task-item { display: 
            flex; 
            justify-content: 
            space-between; 
            align-items: center; 
            background: #0f172a; 
            padding: 12px; 
            border-radius: 8px; 
            margin-bottom: 8px; 
            border: 1px solid 
            #334155;
            animation: slideIn 
            0.3s ease-in-out;
        }
        @keyframes slideIn { from 
        { opacity: 0; transform: 
        translateX(20px); } to { 
        opacity: 1; transform: 
        translateX(0); } } 
        .task-info { display: 
        flex; align-items: 
        center; gap: 10px; flex: 
        1; } .task-text { 
        font-size: 14px; color: 
        #f8fafc; word-break: 
        break-all; } .completed 
        .task-text { 
        text-decoration: 
        line-through; color: 
        #64748b; }
        
        .badge { font-size: 11px; 
            padding: 3px 8px; 
            border-radius: 6px; 
            font-weight: bold;
        }
        .badge-high { background: 
        #dc2626; color: white; }
        .badge-med { background: 
        #d97706; color: white; }
        .badge-low { background: 
        #0284c7; color: white; }
        .actions { display: flex; 
        gap: 5px; } .btn-action { 
        background: #334155; 
        color: white; border: 
        none; padding: 6px 10px; 
        border-radius: 6px; 
        font-size: 12px; cursor: 
        pointer; } 
        .btn-action:hover { 
        background: #475569; } 
        .btn-delete { background: 
        #dc2626; }
        .btn-delete:hover { 
        background: #b91c1c; } 
        .stats-box {
            background: #1e293b; 
            border: 1px solid 
            #334155;
            color: #38bdf8; 
            padding: 12px; 
            border-radius: 10px; 
            text-align: center; 
            margin-bottom: 15px; 
            font-size: 13px; 
            font-weight: bold;
        }
        .back-link { display: 
        block; text-align: 
        center; margin-top: 25px; 
        color: #38bdf8; 
        text-decoration: none; 
        font-size: 13px; } 
        .back-link:hover { 
        text-decoration: 
        underline; }
    </style> </head> <body> <div 
    class="container">
        <div class="header"> 
            <h1>📋 جدول المهام 
            اليومية (To-Do)</h1> 
            <p>منصة sar_linx | 
            نظم مهامك، تتبع 
            إنجازك، وتحكم بيومك 
            بكفاءة</p>
        </div> <div class="card"> 
            <div 
            class="card-title">➕ 
            إضافة مهمة 
            جديدة</div> <div 
            class="row">
                <input 
                type="text" 
                id="taskInput" 
                placeholder="اكتب 
                عنوان المهمة 
                هنا...">
            </div> <div 
            class="row">
                <select 
                id="taskPriority">
                    <option 
                    value="low">أولوية 
                    منخفضة</option> 
                    <option 
                    value="med" 
                    selected>أولوية 
                    متوسطة</option> 
                    <option 
                    value="high">أولوية 
                    عالية 
                    🔥</option>
                </select> </div> 
            <button class="btn" 
            onclick="addTask()">إضافة 
            المهمة 
            للجدول</button>
        </div> <div 
        class="stats-box" 
        id="statsBox">
            إجمالي المهام: 0 | 
            المنجزة: 0 | 
            المتبقية: 0
        </div> <div class="card"> 
            <div 
            class="card-title">📌 
            قائمة المهام</div>
