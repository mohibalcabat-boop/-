<!DOCTYPE html> <html lang="ar" 
dir="rtl"> <head>
    <meta charset="UTF-8"> <meta 
    name="viewport" 
    content="width=device-width, 
    initial-scale=1.0"> 
    <title>معرض الصور 
    والفيديوهات</title> <style>
        :root {
            --bg-color: #0f172a; 
            --card-bg: #1e293b; 
            --primary: #ec4899; 
            --text: #f8fafc; 
            --text-muted: 
            #94a3b8;
        }
        body { font-family: 
            Tahoma, sans-serif; 
            background-color: 
            var(--bg-color); 
            color: var(--text); 
            margin: 0; padding: 
            20px;
        }
        .container { max-width: 
            600px; margin: 0 
            auto;
        }
        .header { background: 
            linear-gradient(135deg, 
            #db2777, #9333ea);
            padding: 20px; 
            border-radius: 16px; 
            text-align: center; 
            margin-bottom: 25px; 
            box-shadow: 0 4px 
            15px rgba(0,0,0,0.4);
        }
        .header h1 { margin: 0 0 
            5px 0; font-size: 
            22px;
        }
        .media-card { 
            background-color: 
            var(--card-bg); 
            border-radius: 12px; 
            padding: 15px; 
            margin-bottom: 15px; 
            border: 1px solid 
            #334155;
            box-shadow: 0 2px 8px 
            rgba(0,0,0,0.2);
        }
        .media-title { font-size: 
            16px; font-weight: 
            bold; color: 
            var(--primary); 
            margin-bottom: 10px;
        }
        /* تصميم للعرض المباشر 
        (صورة أو فيديو) */ 
        .media-container {
            width: 100%; 
            max-height: 250px; 
            border-radius: 8px; 
            overflow: hidden; 
            background: #000; 
            margin-bottom: 10px; 
            display: flex; 
            justify-content: 
            center; align-items: 
            center;
        }
        .media-container img, 
        .media-container video {
            width: 100%; height: 
            auto; max-height: 
            250px; object-fit: 
            contain;
        }
        .btn { display: block; 
            width: 100%; padding: 
            10px; border-radius: 
            8px; text-align: 
            center; 
            text-decoration: 
            none; font-size: 
            13px; font-weight: 
            bold; 
            background-color: 
            var(--primary); 
            color: white; border: 
            none; cursor: 
            pointer;
        }
    </style> </head> <body> <div 
    class="container">
        <!-- ترويسة الموقع --> 
        <div class="header">
            <h1>🎬 معرض الصور 
            والفيديوهات</h1> 
            <p>مختاراتي ووسائطي 
            المرئية</p>
        </div> <!-- 1. نموذج 
        بطاقة فيديو --> <div 
        class="media-card">
            <div 
            class="media-title">🎥 
            عنوان الفيديو 
            هنا</div> <div 
            class="media-container">
                <!-- استبدل 
                الرابط أدناه 
                برابط فيديو مباشر 
                --> <video 
                controls 
                src="رابط_الفيديو_المباشر_هنا.mp4"></video>
            </div> </div> <!-- 2. 
        نموذج بطاقة صورة --> <div 
        class="media-card">
            <div 
            class="media-title">🖼️ 
            عنوان الصورة 
            هنا</div> <div 
            class="media-container">
                <!-- استبدل 
                الرابط أدناه 
                برابط صورة مباشر 
                --> <img 
                src="رابط_الصورة_المباشر_هنا.jpg" 
                alt="صورة">
            </div> </div> </div> 
</body> </html>
