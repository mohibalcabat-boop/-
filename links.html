<!DOCTYPE html> <html lang="ar" 
dir="rtl"> <head>
    <meta charset="UTF-8"> <meta 
    name="viewport" 
    content="width=device-width, 
    initial-scale=1.0"> 
    <title>sar_linx | شجرة 
    الروابط التفاعلية</title> 
    <style>
        :root {
            --bg-color: #1c1411; 
            --card-bg: #2d201b; 
            --text-color: 
            #f5efe6;
            --desc-color: 
            #ffffff;
            --accent-color: 
            #d4a373;
            --border-color: 
            #4a352a;
        }
        body { font-family: 
        Tahoma, sans-serif; 
        background-color: 
        var(--bg-color); color: 
        var(--text-color); 
        margin: 0; padding: 15px; 
        }
        .container { max-width: 
        600px; margin: 0 auto; } 
        .header { background: 
        var(--card-bg); padding: 
        25px 20px; border-radius: 
        14px; text-align: center; 
        margin-bottom: 20px; 
        border: 1px solid 
        var(--border-color); 
        box-shadow: 0 4px 10px 
        rgba(0,0,0,0.4); }
        
        /* حقول التعديل الحر 
        للزائر */ .user-input-box 
        { width: 90%; background: 
        var(--bg-color); border: 
        1px solid 
        var(--accent-color); 
        color: 
        var(--accent-color); 
        padding: 8px; 
        border-radius: 8px; 
        font-size: 16px; 
        font-weight: bold; 
        text-align: center; 
        margin-bottom: 8px; } 
        .user-input-desc { width: 
        90%; background: 
        var(--bg-color); border: 
        1px solid 
        var(--border-color); 
        color: var(--desc-color); 
        padding: 6px; 
        border-radius: 6px; 
        font-size: 13px; 
        text-align: center; } 
        .link-card { background: 
        var(--card-bg); 
        border-radius: 12px; 
        padding: 15px; 
        margin-bottom: 15px; 
        border: 1px solid 
        var(--border-color); 
        text-align: center; } 
        .link-url-input { width: 
        85%; background: 
        var(--bg-color); border: 
        1px solid 
        var(--border-color); 
        color: 
        var(--accent-color); 
        padding: 6px; 
        border-radius: 6px; 
        font-size: 13px; 
        margin-bottom: 8px; 
        text-align: center; } 
        .link-desc-input { width: 
        85%; background: 
        var(--bg-color); border: 
        1px solid 
        var(--border-color); 
        color: var(--desc-color); 
        padding: 6px; 
        border-radius: 6px; 
        font-size: 12px; 
        text-align: center; }
        
        .action-section { 
        text-align: center; 
        margin-top: 25px; } 
        .action-btn { background: 
        var(--accent-color); 
        color: #1c1411; border: 
        none; padding: 12px 25px; 
        border-radius: 8px; 
        font-size: 14px; 
        font-weight: bold; 
        cursor: pointer; 
        box-shadow: 0 4px 8px 
        rgba(0,0,0,0.3); } 
        .action-btn:hover { 
        opacity: 0.9; } .toast { 
        margin-top: 10px; 
        font-size: 12px; color: 
        var(--accent-color); 
        display: none; } 
        .back-link { display: 
        block; text-align: 
        center; margin-top: 20px; 
        color: 
        var(--accent-color); 
        text-decoration: none; 
        font-size: 13px; }
    </style> </head> <body> <div 
    class="container">
        <div class="header"> <!-- 
            الزائر يكتب اسمه 
            بحرية --> <input 
            type="text" 
            class="user-input-box" 
            value="اسم صاحب 
            الصفحة / المشروع"> 
            <!-- الزائر يكتب 
            التفاصيل أو الشعبة 
            بحرية --> <input 
            type="text" 
            class="user-input-desc" 
            value="اكتب هنا الوصف 
            أو الشعبة أو 
            المعلومات التوضيحية">
        </div> <!-- بطاقة رابط 1 
        --> <div 
        class="link-card">
            <input type="text" 
            class="link-url-input" 
            value="https://example.com"> 
            <input type="text" 
            class="link-desc-input" 
            value="وصف توضيحي 
            أبيض للرابط الأول 
            (قابل للتعديل)">
        </div> <!-- بطاقة رابط 2 
        --> <div 
        class="link-card">
            <input type="text" 
            class="link-url-input" 
            value="https://github.com"> 
            <input type="text" 
            class="link-desc-input" 
            value="وصف توضيحي 
            أبيض للرابط الثاني 
            (قابل للتعديل)">
        </div> <!-- بطاقة رابط 3 
        --> <div 
        class="link-card">
            <input type="text" 
            class="link-url-input" 
            value="index.html"> 
            <input type="text" 
            class="link-desc-input" 
            value="العودة للوحة 
            التحكم الرئيسية 
            (sar_linx)">
        </div> <div 
        class="action-section">
            <button 
            class="action-btn" 
            onclick="shareMyLinks()">📤 
            مشاركة هذه 
            الصفحة</button> <div 
            id="toast" 
            class="toast">تم 
            تجهيز البيانات 
            للمشاركة بنجاح! 
            📋</div>
        </div> <a 
        href="index.html" 
        class="back-link">← 
        العودة إلى لوحة التحكم 
        الرئيسية</a>
    </div> <script> function 
        shareMyLinks() {
            const textToShare = 
            "شجرة الروابط الخاصة 
            بي - تفضل بزيارة 
            صفحتي!"; if 
            (navigator.share) {
                navigator.share({title: 
                'شجرة الروابط', 
                text: 
                textToShare, url: 
                window.location.href}).catch(()=>{});
            } else {
                navigator.clipboard.writeText(textToShare).then(() 
                => {
                    const t = 
                    document.getElementById('toast'); 
                    t.style.display 
                    = 'block'; 
                    setTimeout(() 
                    => 
                    t.style.display 
                    = 'none', 
                    3000);
                });
            }
        }
    </script> </body> </html>
